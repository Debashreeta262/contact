<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rolodex &mdash; Contact Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand"><span class="mark">&#9679;</span> Rolodex <span class="tag">contact manager</span></div>
    <button class="btn btn-primary" id="addBtn">+ Add contact</button>
  </div>
</header>

<main class="shell">
  <div class="toolbar">
    <div class="search-wrap">
      <span class="icon">&#128269;</span>
      <input type="text" id="searchInput" placeholder="Search by name, email, phone or company&hellip;">
    </div>
    <select class="filter-select" id="categoryFilter">
      <option value="All">All categories</option>
      <option value="Personal">Personal</option>
      <option value="Work">Work</option>
      <option value="Family">Family</option>
      <option value="Other">Other</option>
    </select>
    <select class="filter-select" id="sortSelect">
      <option value="name">Sort: Name (A&ndash;Z)</option>
      <option value="recent">Sort: Recently added</option>
      <option value="company">Sort: Company</option>
    </select>
  </div>

  <div class="count-row">
    <span id="countLabel">Loading contacts&hellip;</span>
  </div>

  <div class="contact-grid" id="contactGrid">
    <div class="skeleton-card"></div>
    <div class="skeleton-card"></div>
    <div class="skeleton-card"></div>
  </div>
</main>

<footer class="site-footer">Rolodex &mdash; built with Node, Express, MongoDB and vanilla JS.</footer>

<!-- Add / Edit modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Add contact</h2>
      <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
    </div>

    <div class="form-error" id="formError"></div>

    <form id="contactForm" novalidate>
      <input type="hidden" id="contactId">

      <div class="field">
        <label for="name">Name <span class="required">*</span></label>
        <input type="text" id="name" required maxlength="100">
      </div>

      <div class="field-row">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email">
        </div>
        <div class="field">
          <label for="phone">Phone</label>
          <input type="tel" id="phone">
        </div>
      </div>
      <div class="field-hint" style="margin-top:-10px; margin-bottom:16px;">Provide at least an email or a phone number.</div>

      <div class="field-row">
        <div class="field">
          <label for="company">Company</label>
          <input type="text" id="company" maxlength="100">
        </div>
        <div class="field">
          <label for="category">Category</label>
          <select id="category">
            <option value="Personal">Personal</option>
            <option value="Work">Work</option>
            <option value="Family">Family</option>
            <option value="Other" selected>Other</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="address">Address</label>
        <input type="text" id="address" maxlength="250">
      </div>

      <div class="field">
        <label for="notes">Notes</label>
        <textarea id="notes" maxlength="500"></textarea>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="saveBtn">
          <span class="spinner"></span>
          <span class="btn-label">Save contact</span>
        </button>
      </div>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
